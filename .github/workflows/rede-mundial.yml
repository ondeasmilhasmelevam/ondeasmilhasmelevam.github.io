name: Rede mundial de milhas
on:
  schedule:
    - cron: '25 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rede-mundial.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: rede-mundial
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ondeasmilhasmelevam/oamml-privado
          token: ${{ secrets.PRIVADO_TOKEN }}
          path: .privado
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Atualizar todos os programas sem enviar alertas
        run: |
          mkdir -p ferramentas
          cp .privado/ferramentas/grafo.py ferramentas/
          python ferramentas/grafo.py
